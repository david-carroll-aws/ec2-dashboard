<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EC2 Instance Dashboard</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #38bdf8;
        }

        #status {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #38bdf8;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <h1>EC2 Instance Dashboard</h1>
    <p id="status">Click below to fetch live instance data.</p>
    <button onclick="fetchInstances()">Refresh Instances</button>

    <table id="instanceTable" style="display: none;">
        <thead>
            <tr>
                <th>Instance ID</th>
                <th>State</th>
                <th>Type</th>
                <th>Public IP</th>
                <th>Availability Zone</th>
            </tr>
        </thead>
        <tbody id="instanceBody"></tbody>
    </table>

    <script>
        // TODO: replace with your actual API Gateway invoke URL
        const API_URL = "https://l9g4tooe3d.execute-api.us-east-1.amazonaws.com/instances";

        async function fetchInstances() {
            const status = document.getElementById("status");
            const table = document.getElementById("instanceTable");
            const body = document.getElementById("instanceBody");

            status.textContent = "Loading...";
            body.innerHTML = "";

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                data.instances.forEach(instance => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td><a href="details.html?id=${instance.instance_id}" style="color:#38bdf8;">${instance.instance_id}</a></td>
                        <td>${instance.state}</td>
                        <td>${instance.instance_type}</td>
                        <td>${instance.public_ip || "—"}</td>
                        <td>${instance.availability_zone}</td>
                    `;

                    body.appendChild(row);
                });

                table.style.display = "table";
                status.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                status.textContent = `Error fetching data: ${err.message}`;
            }
        }
    </script>

</body>
</html>
